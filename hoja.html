<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Worksheet</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17181b">
<link rel="icon" href="icon-192.png">
<style>
:root{--azul:#1f4e79;--azul2:#2e75b6;--gris:#e9edf2;--borde:#c9d1da;--txt:#1b2733}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#cfd6de;color:var(--txt);display:flex;flex-direction:column;overflow:hidden}
#top{display:flex;align-items:center;gap:8px;padding:4px 10px;background:#185abd;color:#fff}
#top .brand{font-size:17px;margin-right:4px}
#top button{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:0 14px;font-size:14px;min-height:36px}
#top button.qa{padding:0;min-width:36px;font-size:18px}
#top button.primary{background:#fff;color:#185abd;font-weight:700}
#fname{flex:1;min-width:120px;max-width:380px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);border-radius:6px;color:#fff;padding:7px 10px;font-size:14px}
#tabs{display:flex;gap:0;background:#fff;padding:0 6px;overflow-x:auto;border-bottom:1px solid #e1e1e1;white-space:nowrap}
.tab{border:none;background:none;padding:0 14px;font-size:15px;color:#333;position:relative;min-height:42px;font-family:inherit}
.tab.on{color:#185abd;font-weight:600}
.tab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;background:#185abd;border-radius:2px}
.tab.file{color:#185abd;font-weight:600}
.tab.tabtable{color:#7a3e9d}
#tools{background:#fbfbfb;border-bottom:1px solid #d6d6d6;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
.rb{display:none;align-items:stretch;padding:6px 4px 0;min-width:min-content}
.rb.on{display:flex}
.g{display:flex;flex-direction:column;padding:0 8px;border-right:1px solid #e1e1e1}
.g:last-child{border:none}
.gb{display:flex;gap:6px;align-items:center;flex:1}
.col{display:flex;flex-direction:column;gap:4px;justify-content:center}
.row{display:flex;gap:2px;align-items:center}
.gl{text-align:center;font-size:11.5px;color:#555;padding:3px 0 4px}
.b{min-width:34px;height:34px;border:1px solid transparent;background:none;border-radius:5px;font-size:15px;padding:0 7px;color:#222;font-family:inherit}
.b.sm{height:26px;font-size:13px;text-align:left}
.b:active{background:#ddd}.b.on{background:#cfe0f7;border-color:#9bbbe9}
.bb{display:flex;flex-direction:column;align-items:center;justify-content:center;height:78px;min-width:60px;gap:3px;font-size:13px;padding:0 6px}
.bb .ic{font-size:26px;line-height:1}
select.s{height:34px;border:1px solid #c8c8c8;border-radius:5px;background:#fff;font-size:14px;padding:0 4px;color:#222;font-family:inherit}
label.cp{position:relative;width:34px;height:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:5px;font-size:16px}
label.cp input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;padding:0;border:none}
label.cp i{display:block;width:18px;height:4px;margin-top:1px}
.gal{display:flex;gap:4px;border:1px solid #d6d6d6;border-radius:5px;padding:4px;background:#fff;align-items:center;max-width:290px;overflow-x:auto}
.gal button{flex:0 0 92px;width:92px;height:62px;border:1px solid transparent;background:#fff;border-radius:4px;display:flex;align-items:center;justify-content:center;padding:0 4px;font-family:"Times New Roman",serif;color:#000}
.gal button:active{background:#e5eefb}
#unsaved{display:flex;align-items:center;gap:10px;background:#fff4c4;border-bottom:1px solid #e7d98a;padding:5px 12px;font-size:13px;color:#4a3f00;flex-wrap:wrap}
#unsaved[hidden]{display:none}
#unsaved .ico{width:16px;height:16px;border-radius:50%;background:#185abd;color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
#unsaved u{color:#333}
#unsaved button{min-height:30px;border:1px solid #b9b9b9;background:#fff;border-radius:4px;padding:0 16px;font-size:13px}
#back{position:fixed;inset:0;background:#185abd;z-index:20;display:flex}
#back[hidden]{display:none}
#back .bk{display:flex;flex-direction:column;gap:4px;padding:16px;min-width:260px;color:#fff}
#back .bk button{background:none;border:none;color:#fff;font-size:17px;text-align:left;padding:12px 14px;border-radius:6px;font-family:inherit}
#back .bk button:active,#back .bk button:hover{background:rgba(255,255,255,.18)}
#bkInfo{margin:14px;font-size:14px;opacity:.85}
#doc.marks p::after,#doc.marks h1::after,#doc.marks h2::after,#doc.marks h3::after,#doc.marks li::after{content:"¶";color:#6a8ccf;font-size:.85em;margin-left:2px}
#doc table.nob td,#doc table.nob th{border:1px dotted #bbb}
#panel{display:none;background:#fff;border-bottom:1px solid var(--borde);padding:10px 12px;gap:10px;align-items:center;flex-wrap:wrap}
#panel.show{display:flex}
#panel input[type=text],#panel input[type=number]{padding:9px;border:1px solid var(--borde);border-radius:7px;font-size:15px;min-height:42px}
#panel input[type=number]{width:80px}
#panel button{min-height:42px;padding:0 14px;border:1px solid var(--azul2);background:var(--azul2);color:#fff;border-radius:7px;font-size:15px}
#panel button.sec{background:#fff;color:var(--azul2)}
#panel label{font-size:14px;display:flex;gap:6px;align-items:center}
#scroll{flex:1;overflow:auto;background:#e6e6e6;padding:16px 8px 60px;-webkit-overflow-scrolling:touch}
#sheet{width:100%;max-width:816px;margin:0 auto;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);padding:56px 64px;min-height:1056px}
#hdrPrev,#ftrPrev{color:#778;font-size:11px;display:flex;align-items:center;gap:10px;border:1px dashed #dde;padding:4px 8px;margin-bottom:14px;user-select:none}
#ftrPrev{margin:14px 0 0;justify-content:space-between}
#hdrPrev img{max-height:40px}
#hdrPrev:empty,#ftrPrev:empty{display:none}
#doc{outline:none;min-height:800px;font:11pt "Times New Roman",Tinos,"Liberation Serif",serif;line-height:1.15;word-wrap:break-word}
#doc p{margin:0 0 6pt}
#doc h1{font-size:16pt;margin:12pt 0 6pt}
#doc h2{font-size:14pt;margin:10pt 0 5pt}
#doc h3{font-size:12pt;margin:8pt 0 4pt}
#doc table{border-collapse:collapse;width:100%;margin:6pt 0;table-layout:auto}
#doc td,#doc th{border:1px solid #444;padding:4px 6px;vertical-align:top;min-width:30px}
#doc th{background:#e7ecf2;font-weight:700}
#doc img{max-width:100%;height:auto}
#doc .pb{border-top:2px dashed #99a;margin:14px 0;height:0;text-align:center}
#doc .pb::after{content:"salto de página";position:relative;top:-9px;background:#fff;color:#99a;font-size:10px;padding:0 6px}
#doc blockquote{margin:0 0 0 40px;padding:0;border:none}
#doc td.sel,#doc th.sel{outline:2px solid var(--azul2);outline-offset:-2px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#223;color:#fff;padding:10px 16px;border-radius:9px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;z-index:9}
#toast.show{opacity:.95}
#status{display:flex;align-items:center;gap:10px;padding:5px 12px;background:#f6f8fa;border-top:1px solid var(--borde);font-size:13px;color:#445}
#status .sp{flex:1}
#status button{min-width:38px;min-height:34px;border:1px solid var(--borde);background:#fff;border-radius:7px;font-size:16px}
#doc p.cap{text-align:center;font-size:10pt}
#symgrid{display:flex;flex-wrap:wrap;gap:6px}
#symgrid button{min-width:44px;background:#fff;color:var(--txt);border-color:var(--borde);font-size:17px}
@media (max-width:760px){#sheet{padding:28px 18px!important}}
/* ===== Tema grafito oscuro, acento ámbar ===== */
:root{--azul:#f5b301;--azul2:#f5b301;--gris:#3a3e45;--borde:#43474f;--txt:#e8e9eb}
body{background:#17181b}
#top{background:#17181b;color:#e8e9eb;border-bottom:1px solid #2c2f34}
#top button,#top a.lnk{background:#2c2f34;color:#e8e9eb;border:1px solid #43474f}
#top a.lnk{display:inline-flex;align-items:center;border-radius:6px;padding:0 14px;font-size:14px;min-height:36px;text-decoration:none}
#top button.primary{background:#f5b301;color:#1a1a1a;border-color:#f5b301}
#fname{background:#2c2f34;border:1px solid #43474f;color:#e8e9eb}
#tabs{background:#1f2125;border-bottom:1px solid #2c2f34}
.tab{color:#a9adb4}.tab.on,.tab.file{color:#f5b301}.tab.on::after{background:#f5b301}.tab.tabtable{color:#7fd1c7}
#tools{background:#2a2d32;border-bottom:1px solid #3a3e45}
.g{border-right:1px solid #3a3e45}.gl{color:#9a9fa7}
.b{color:#e8e9eb}.b:active{background:#3a3e45}.b.on{background:#4a4220;border-color:#f5b301}
select.s{background:#3a3e45;color:#e8e9eb;border:1px solid #4a4e56}
label.cp{color:#e8e9eb}
.gal{background:#1f2125;border:1px solid #43474f}
.gal button{background:#2a2d32;color:#e8e9eb}.gal button:active{background:#3a3e45}
#unsaved{background:#3a3220;border-bottom:1px solid #5a4a1c;color:#f3dfa0}
#unsaved u{color:#f3dfa0}#unsaved .ico{background:#f5b301;color:#1a1a1a}
#unsaved button{background:#2c2f34;color:#e8e9eb;border:1px solid #5a5e66}
#back{background:#17181b}
#scroll{background:#1a1b1e}
#panel{background:#2a2d32;border-bottom:1px solid #3a3e45;color:#e8e9eb}
#panel input[type=text],#panel input[type=number],#panel select{background:#17181b;color:#e8e9eb;border:1px solid #4a4e56;border-radius:7px;min-height:42px;padding:0 8px;font-size:15px}
#panel button{background:#f5b301;border-color:#f5b301;color:#1a1a1a}
#panel button.sec{background:#2a2d32;color:#f5b301;border-color:#f5b301}
#status{background:#1f2125;border-top:1px solid #2c2f34;color:#a9adb4}
#status button{background:#2c2f34;color:#e8e9eb;border-color:#43474f}
#symgrid button{background:#2c2f34;color:#e8e9eb;border-color:#43474f}
#toast{background:#f5b301;color:#1a1a1a}
#doc{color:#000}
#doc td.sel,#doc th.sel{outline-color:#f5b301}
#ai{display:none;position:fixed;left:0;right:0;bottom:0;z-index:18;background:#2a2d32;border-top:2px solid #f5b301;padding:10px 14px 14px;max-height:75vh;color:#e8e9eb;box-shadow:0 -10px 24px rgba(0,0,0,.5)}
#ai.show{display:flex;flex-direction:column;gap:8px}
#ai .aih{display:flex;align-items:center;gap:10px}
#aiModel{font-size:12px;color:#a9adb4;background:#1f2125;border-radius:10px;padding:2px 9px}
#ai button{min-height:40px;padding:0 14px;border:1px solid #f5b301;background:#f5b301;color:#1a1a1a;border-radius:7px;font-size:14px;font-family:inherit}
#ai button.sec,#ai button.aix{background:#2a2d32;color:#f5b301}
#ai button:disabled{opacity:.45}
#ai input[type=text]{width:100%;min-height:42px;padding:0 10px;border-radius:7px;border:1px solid #4a4e56;background:#17181b;color:#e8e9eb;font-size:15px}
#aiAsk{display:flex;flex-direction:column;gap:8px}#aiAsk[hidden]{display:none}
#aiAsk label{font-size:13px;color:#a9adb4;display:flex;gap:6px;align-items:center}
#aiStat{font-size:13px;color:#a9adb4;min-height:18px}
#aiStat.err{color:#ff9d8a}
#aiOut{width:100%;background:#17181b;color:#e8e9eb;border:1px solid #4a4e56;border-radius:7px;padding:10px;font:14px/1.45 system-ui,sans-serif;resize:vertical}
#ai .aib{display:flex;gap:8px;flex-wrap:wrap}
#tabs .tab.sm{padding:0 12px;font-size:17px}
#tabs .tab.gold{color:#f5b301;font-weight:700;font-size:14px}
#tabAct{display:none}
body.compact #tabAct{display:flex}
body.compact #top,body.compact #status{display:none}
body.rc #tools{display:none}
body.rc.peek #tools{display:block;position:absolute;left:0;right:0;top:var(--rt,90px);z-index:15;box-shadow:0 10px 20px rgba(0,0,0,.55)}
body.rc #btnRibbon{transform:rotate(180deg)}

@media print{
 #ai{display:none!important}
 #status{display:none!important}
 body{background:#fff;overflow:visible;display:block}
 #top,#tabs,#tools,#unsaved,#back,#panel,#toast,#hdrPrev,#ftrPrev{display:none!important}
 #scroll{overflow:visible;padding:0}
 #sheet{box-shadow:none;max-width:none;padding:0;min-height:0}
 #doc .pb{border:none;page-break-after:always;margin:0}
 #doc .pb::after{content:""}
 @page{margin:2cm}
}
/* ===== Worksheet ===== */
#fxbar{display:flex;align-items:center;gap:6px;padding:5px 8px;background:#1f2125;border-bottom:1px solid #2c2f34}
#nameBox{width:92px;min-height:36px;border-radius:6px;border:1px solid #43474f;background:#17181b;color:#e8e9eb;padding:0 8px;font-size:14px;text-align:center}
#fx{flex:1;min-width:0;min-height:36px;border-radius:6px;border:1px solid #43474f;background:#17181b;color:#e8e9eb;padding:0 10px;font-size:15px;font-family:ui-monospace,Consolas,monospace}
.fxl{color:#f5b301;font-style:italic;font-weight:700;padding:0 2px}
#btnExt{border:1px solid #43474f;background:#2c2f34;color:#e8e9eb;min-height:36px;padding:0 12px}
#btnExt.on{background:#4a4220;border-color:#f5b301;color:#f5b301}
#gridwrap{flex:1;overflow:auto;background:#1a1b1e;-webkit-overflow-scrolling:touch;position:relative}
#grid{border-collapse:separate;border-spacing:0;table-layout:fixed;background:#fff;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;width:0;outline:none}
#grid th{background:#2a2d32;color:#a9adb4;font-weight:500;font-size:12.5px;border-right:1px solid #3a3e45;border-bottom:1px solid #3a3e45;position:sticky;z-index:3;user-select:none;text-align:center;padding:0;overflow:hidden}
#grid thead th{top:0;height:26px;z-index:4}
#grid th.rh{left:0;z-index:3}
#grid th.corner{left:0;z-index:5}
#grid th.hl{background:#4a4220;color:#f5b301}
#grid th.ch{position:sticky}
#grid .rz{position:absolute;right:-8px;top:0;bottom:0;width:18px;cursor:col-resize;z-index:6;touch-action:none}
#grid td{border-right:1px solid #d9dde2;border-bottom:1px solid #d9dde2;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:clip;color:#111;background:#fff;height:26px;cursor:cell}
body.nogrid #grid td{border-color:transparent}
#grid td.fz{position:sticky;z-index:2}
#grid td.in{background-image:linear-gradient(rgba(245,179,1,.18),rgba(245,179,1,.18))}
#grid td.act{outline:2px solid #f5b301;outline-offset:-2px;z-index:1}
#grid td.ed{padding:0;overflow:visible}
#grid td.ed input{width:100%;height:100%;min-width:90px;border:2px solid #f5b301;outline:none;font:inherit;padding:0 4px;background:#fff;color:#111;box-sizing:border-box}
#grid td.cv{display:none}
#sheetbar{display:flex;align-items:center;gap:6px;padding:4px 8px;background:#1f2125;border-top:1px solid #2c2f34;color:#a9adb4;font-size:13px}
#stabs{display:flex;gap:2px;overflow-x:auto;max-width:55%}
.stab{border:1px solid #3a3e45;background:#2a2d32;color:#c9ccd1;padding:0 14px;min-height:34px;border-radius:6px 6px 0 0;font-size:14px;white-space:nowrap}
.stab.on{background:#f5b301;color:#1a1a1a;border-color:#f5b301;font-weight:600}
#sAdd,#zIn,#zOut{min-width:34px;min-height:34px;border:1px solid #43474f;background:#2c2f34;color:#e8e9eb;border-radius:6px;font-size:16px}
#stSum{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#chartBox{position:fixed;right:12px;bottom:56px;z-index:12;background:#fff;border:2px solid #f5b301;border-radius:10px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.6);width:min(640px,94vw)}
#chartBox[hidden]{display:none}
#chartBox canvas{width:100%;height:auto;display:block}
#chartBox .chh{display:flex;gap:8px;align-items:center;color:#111;margin-bottom:6px}
#chartBox button{min-height:34px;border:1px solid #f5b301;background:#fff;color:#111;border-radius:6px;padding:0 10px}
body.compact #top,body.compact #sheetbar .x{display:none}
@media print{#gridwrap{overflow:visible}}
</style>
</head>
<body>
<div id="top">
  <strong class="brand">Worksheet</strong>
  <button class="qa" data-act="undo" title="Deshacer">↶</button>
  <button class="qa" data-act="redo" title="Rehacer">↷</button>
  <input id="fname" type="text" value="Libro sin título" aria-label="Nombre del archivo">
  <a class="lnk" href="index.html" title="Volver al inicio de Work Suite">⌂ Work Suite</a> <a class="lnk" href="works.html" title="Abrir el editor de documentos">Works (documentos)</a>
  <button data-act="open">Abrir</button>
  <button data-act="save" class="primary">Guardar</button>
</div>

<div id="tabs">
  <button class="tab file" data-act="backstage">Archivo</button>
  <button class="tab on" data-tab="inicio">Inicio</button>
  <button class="tab" data-tab="insertar">Insertar</button>
  <button class="tab" data-tab="formulas">Fórmulas</button>
  <button class="tab" data-tab="datos">Datos</button>
  <button class="tab" data-tab="vista">Vista</button>
  <span style="flex:1"></span>
  <span id="tabAct"><button class="tab sm" data-act="undo">↶</button><button class="tab sm" data-act="redo">↷</button><button class="tab sm gold" data-act="save">Guardar</button></span>
  <button class="tab sm" id="btnRibbon" data-act="ribbonToggle" title="Contraer o expandir la cinta (doble toque en una pestaña)">⌃</button>
</div>

<div id="tools">
 <div class="rb on" id="rb-inicio">
  <div class="g"><div class="gb">
    <button class="b bb" data-act="paste"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="1.6"><rect x="5" y="4" width="14" height="17" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1" fill="#2a2d32"/></svg>Pegar</button>
    <div class="col"><button class="b sm" data-act="cut">Cortar</button><button class="b sm" data-act="copy">Copiar</button><button class="b sm" data-act="clear">Borrar</button></div>
  </div><div class="gl">Portapapeles</div></div>

  <div class="g"><div class="gb"><div class="col">
    <div class="row">
      <button class="b" data-fmt="b" title="Negrita"><b>N</b></button>
      <button class="b" data-fmt="i" title="Cursiva"><i>K</i></button>
      <button class="b" data-fmt="u" title="Subrayado"><u>S</u></button>
      <label class="cp" title="Color de fuente"><b>A</b><i id="barFore" style="background:#c0392b"></i><input type="color" id="colFore" value="#c0392b"></label>
      <label class="cp" title="Color de relleno"><span style="font-size:15px">◪</span><i id="barFill" style="background:#ffe699"></i><input type="color" id="colFill" value="#ffe699"></label>
      <select class="s" id="selBd" title="Bordes"><option value="">Bordes…</option><option value="all">Todos los bordes</option><option value="out">Contorno</option><option value="none">Sin bordes</option></select>
    </div>
    <div class="row">
      <button class="b" data-fmt="al-l" title="Alinear a la izquierda">⇤</button>
      <button class="b" data-fmt="al-c" title="Centrar">↔</button>
      <button class="b" data-fmt="al-r" title="Alinear a la derecha">⇥</button>
      <button class="b" data-fmt="wr" title="Ajustar texto">↵</button>
      <button class="b" data-act="merge" title="Combinar o separar celdas">⊞</button>
      <button class="b" data-act="clrFmt" title="Quitar formato">⌫</button>
    </div>
  </div></div><div class="gl">Fuente y alineación</div></div>

  <div class="g"><div class="gb"><div class="col">
    <select class="s" id="selNf" title="Formato de número" style="width:150px"><option value="g">General</option><option value="n0">Número 0</option><option value="n1">Número 0,0</option><option value="n2">Número 0,00</option><option value="n3">Número 0,000</option><option value="m2">Miles 1.234,00</option><option value="p0">Porcentaje 0%</option><option value="p1">Porcentaje 0,0%</option></select>
    <div class="row"><button class="b" data-act="decMore" title="Más decimales">.0→</button><button class="b" data-act="decLess" title="Menos decimales">←.0</button></div>
  </div></div><div class="gl">Número</div></div>

  <div class="g"><div class="gb">

    case 'ROUNDDOWN':return roundTo(toNum(A(0)),args[1]?toNum(A(1)):0,'down');
    case 'ABS':return Math.abs(toNum(A(0)));
    case 'SQRT':{const x=toNum(A(0));if(x<0)throw new Error('#NUM!');return Math.sqrt(x);}
    case 'POWER':return Math.pow(toNum(A(0)),toNum(A(1)));
    case 'MOD':{const d=toNum(A(1));if(d===0)throw new Error('#DIV/0!');const x=toNum(A(0));return x-d*Math.floor(x/d);}
    case 'INT':return Math.floor(toNum(A(0)));
    case 'PI':return Math.PI;
    case 'CONCAT':case 'CONCATENATE':return flatAll(args).map(toStr).join('');
    case 'LEN':return toStr(A(0)).length;
    case 'UPPER':return toStr(A(0)).toUpperCase();
    case 'LOWER':return toStr(A(0)).toLowerCase();
    case 'TRIM':return toStr(A(0)).trim().replace(/\s+/g,' ');
    case 'ISNUMBER':{try{return typeof A(0)==='number';}catch(e){return false;}}
    case 'ISTEXT':{try{return typeof A(0)==='string';}catch(e){return false;}}
    case 'ISBLANK':{const v=evalNode(args[0]);return v===null;}
    case 'TODAY':{const d=new Date();return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(1899,11,30))/86400000);}
    case 'SUMIF':case 'COUNTIF':case 'AVERAGEIF':{
      const r=evalNode(args[0]);const rv=r&&r.rng?r.rng:[r];const f=critFn(evalNode(args[1]));
      let sv=rv;if(args[2]){const s2=evalNode(args[2]);sv=s2&&s2.rng?s2.rng:[s2];}
      let sum=0,n=0;rv.forEach((x,i)=>{if(isErr(x))throw new Error(x.e);if(f(x)){n++;const y=sv[i];if(typeof y==='number')sum+=y;}});
      return name==='COUNTIF'?n:name==='SUMIF'?sum:(n?sum/n:(()=>{throw new Error('#DIV/0!');})());}
  }
  throw new Error('#NOMBRE?');
}

/* ----- reescritura de referencias (copiar, insertar, eliminar) ----- */
function remapFormula(raw,f){
  const body=raw.slice(1);let toks;try{toks=tokenize(body);}catch(e){return raw;}
  const edits=[];
  for(let i=0;i<toks.length;i++){const t=toks[i];if(t.t!=='ref')continue;
    const isStart=toks[i+1]&&toks[i+1].t===':'&&toks[i+2]&&toks[i+2].t==='ref';
    const isEnd=toks[i-1]&&toks[i-1].t===':'&&toks[i-2]&&toks[i-2].t==='ref';
    const m=REFRE.exec(t.raw);const a={r:+m[4]-1,c:colIdx(m[2].toUpperCase())};
    const n=f(a,isStart?'start':isEnd?'end':'single',m);
    edits.push({s:t.s,e:t.e,txt:n&&n.r>=0&&n.c>=0?(m[1]+colName(n.c)+m[3]+(n.r+1)):'#REF!'});}
  let out=body;for(let k=edits.length-1;k>=0;k--)out=out.slice(0,edits[k].s)+edits[k].txt+out.slice(edits[k].e);
  return '='+out;
}
function shiftFormula(raw,dr,dc){return remapFormula(raw,(a,role,m)=>({r:m[3]?a.r:a.r+dr,c:m[1]?a.c:a.c+dc}));}
function excelFormula(raw){ // fórmula lista para Excel: nombres en inglés y comas
  const body=raw.slice(1);let toks;try{toks=tokenize(body);}catch(e){return body;}
  let out=body;for(let k=toks.length-1;k>=0;k--){const t=toks[k];
    if(t.t==='fn'){const nm=canonFn(t.v);out=out.slice(0,t.s)+nm+out.slice(t.e);}
    else if(t.t===','&&t.v===';')out=out.slice(0,t.s)+','+out.slice(t.e);
    else if(t.t==='id'&&(t.v==='VERDADERO'||t.v==='FALSO'))out=out.slice(0,t.s)+(t.v==='VERDADERO'?'TRUE':'FALSE')+out.slice(t.e);}
  return out;
}

/* ================= formato de números ================= */
function fmtG(v){if(Number.isInteger(v))return String(v);let s=parseFloat(v.toPrecision(10)).toString();if(/e/.test(s))return s.replace('.',',');return s.replace('.',',');}
function addThousands(s){const p=s.split(',');p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.');return p.join(',');}
function fmtNum(v,nf){
  const dec={n0:0,n1:1,n2:2,n3:3,m2:2,m0:0,p0:0,p1:1,p2:2}[nf];
  if(nf==='g'||dec===undefined)return fmtG(v);
  if(nf[0]==='p')return (v*100).toFixed(dec).replace('.',',')+'%';
  let s=v.toFixed(dec).replace('.',',');if(nf[0]==='m')s=addThousands(s);return s;
}
function displayOf(r,c){
  const v=valueOf(r,c);if(v===null)return '';if(isErr(v))return v.e;
  if(typeof v==='number')return fmtNum(v,styleOf(r,c).nf||'g');
  if(typeof v==='boolean')return v?'VERDADERO':'FALSO';return String(v);
}
const NF_X={g:null,n0:'0',n1:'0.0',n2:'0.00',n3:'0.000',m0:'#,##0',m2:'#,##0.00',p0:'0%',p1:'0.0%',p2:'0.00%'};
function nfFrom(fmt){
  if(!fmt||fmt==='General')return 'g';
  if(/[dmy]/i.test(fmt.replace(/"[^"]*"/g,'').replace(/0\.0+|#,##0/g,''))&&/y|d{1,2}[/\-.]/i.test(fmt))return 'g';
  const dec=(/\.(0+)/.exec(fmt)||[,''])[1].length;
  if(fmt.includes('%'))return 'p'+Math.min(dec,2);
  if(fmt.includes('#,##0'))return dec>=1?'m2':'m0';
  if(/^0(\.0+)?$/.test(fmt))return 'n'+Math.min(dec,3);
  return 'g';
}

/* ================= formato condicional ================= */
function cfStyle(r,c){
  const s=sh();if(!s.cf.length)return null;let out=null;
  for(const rule of s.cf){const rg=parseRange(rule.ref);if(!rg||r<rg.r0||r>rg.r1||c<rg.c0||c>rg.c1)continue;
    const v=valueOf(r,c);let ok=false;
    try{
      if(rule.op==='txt')ok=v!==null&&String(isErr(v)?v.e:v).toLowerCase().includes(String(rule.val).toLowerCase());
      else if(rule.op==='f'){const x=evalFormula(shiftFormula('='+rule.val,r-rg.r0,c-rg.c0).slice(1));ok=x===true||(typeof x==='number'&&x!==0);}
      else{const num=parseFloat(String(rule.val).replace(',','.'));if(typeof v==='number'&&!isNaN(num))ok={lt:v<num,gt:v>num,le:v<=num,ge:v>=num,eq:v===num,ne:v!==num}[rule.op];
        else if(typeof v==='string'&&(rule.op==='eq'||rule.op==='ne'))ok=(v.toLowerCase()===String(rule.val).toLowerCase())===(rule.op==='eq');}
    }catch(e){ok=false;}
    if(ok){out={bg:rule.bg,fg:rule.fg};break;}}
  return out;
}

  clip={r0:q.r0,c0:q.c0,cells:cells,tsv:selTSV()};

function pasteText(txt){
  const q=selRect();snap();
  if(clip&&txt.replace(/\r/g,'')===clip.tsv){
    const dr=q.r0-clip.r0,dc=q.c0-clip.c0;
    clip.cells.forEach((row,i)=>row.forEach((x,j)=>{const r=q.r0+i,c=q.c0+j;if(r>=2000||c>=120)return;
      if(!x){setRaw(r,c,'');return;}
      let raw=x.raw;if(typeof raw==='string'&&raw[0]==='=')raw=shiftFormula(raw,dr,dc);
      setRaw(r,c,raw);const k=r+','+c;if(!sh().cells[k])sh().cells[k]={raw:raw,st:{}};sh().cells[k].st=Object.assign({},x.st);}));

    const rows=txt.replace(/\r/g,'').split('\n');if(rows.length&&rows[rows.length-1]==='')rows.pop();
    rows.forEach((line,i)=>line.split('\t').forEach((v,j)=>{if(q.r0+i<2000&&q.c0+j<120)setRaw(q.r0+i,q.c0+j,v);}));

/* ----- insertar / eliminar filas y columnas ----- */
function structure(kind,idx,n){
  snap();const s=sh();const isRow=kind==='row';
  const mapIdx=(i,role)=>{ // devuelve nuevo índice o null
    if(n>0)return i>=idx?i+n:i;
    const d=-n;if(i<idx)return i;if(i>=idx+d)return i-d;
    if(role==='start')return idx;if(role==='end')return idx-1>=0?idx-1:null;return null;};
  const fref=(a,role)=>{const v=isRow?a.r:a.c;const nv=mapIdx(v,role);if(nv===null)return null;return isRow?{r:nv,c:a.c}:{r:a.r,c:nv};};
  const nc={};
  Object.keys(s.cells).forEach(k=>{const p=k.split(',');let r=+p[0],c=+p[1];const x=s.cells[k];const v=isRow?r:c;const nv=mapIdx(v,'single');if(nv===null)return;
    if(isRow)r=nv;else c=nv;
    if(typeof x.raw==='string'&&x.raw[0]==='=')x.raw=remapFormula(x.raw,(a,role)=>fref(a,role));
    nc[r+','+c]=x;});
  s.cells=nc;
  // recalcular fórmulas restantes de celdas que no cambiaron de lugar ya fue hecho arriba (todas pasan por el bucle)
  s.cf=s.cf.map(x=>{const g=parseRange(x.ref);if(!g)return null;
    const a=fref({r:g.r0,c:g.c0},'start'),b=fref({r:g.r1,c:g.c1},'end');if(!a||!b)return null;x.ref=addr(a.r,a.c)+':'+addr(b.r,b.c);return x;}).filter(Boolean);
  s.merges=s.merges.map(m=>{const a=fref({r:m.r0,c:m.c0},'start'),b=fref({r:m.r1,c:m.c1},'end');if(!a||!b||(a.r===b.r&&a.c===b.c))return null;return {r0:a.r,c0:a.c,r1:b.r,c1:b.c};}).filter(Boolean);
  const mp=isRow?s.rowH:s.colW;const np={};Object.keys(mp).forEach(k=>{const nv=mapIdx(+k,'single');if(nv!==null)np[nv]=mp[k];});if(isRow)s.rowH=np;else s.colW=np;
  markDirty();buildGrid();
  if(isRow)setSel(idx,0,idx,0);else setSel(0,idx,0,idx);
}

/* ----- ordenar ----- */
function sortSel(dir){
  const s=sh();let q=selRect();const single=q.r0===q.r1&&q.c0===q.c1;
  const col=sel.c;
  if(single){let r0=q.r0,r1=q.r0,c0=q.c0,c1=q.c0;const has=(r,c)=>rawAt(r,c)!=='';
    while(r0>0&&has(r0-1,col))r0--;while(has(r1+1,col))r1++;
    c0=0;c1=0;for(let c=0;c<NC;c++){let any=false;for(let r=r0;r<=r1;r++)if(has(r,c)){any=true;break;}if(any){c1=c;}}
    q={r0:r0,r1:r1,c0:c0,c1:c1};}
  if(q.r1<=q.r0){toast('No hay filas que ordenar');return;}
  snap();
  let hdr=false;const v0=valueOf(q.r0,col),v1=valueOf(q.r0+1,col);if(typeof v0==='string'&&typeof v1==='number')hdr=true;
  if(single&&typeof v0==='string')hdr=true;
  const first=q.r0+(hdr?1:0);const rows=[];
  for(let r=first;r<=q.r1;r++){const row=[];for(let c=q.c0;c<=q.c1;c++){const x=cellAt(r,c);row.push(x?{raw:x.raw,st:Object.assign({},x.st||{})}:null);}rows.push({v:valueOf(r,col),row:row,r:r});}
  rows.sort((a,b)=>{const x=a.v,y=b.v;if(x===null&&y===null)return 0;if(x===null)return 1;if(y===null)return -1;return dir*cmpVals(x,y);});
  rows.forEach((o,i)=>{const r=first+i;o.row.forEach((x,j)=>{const c=q.c0+j;const k=r+','+c;if(!x){delete s.cells[k];return;}
    let raw=x.raw;if(typeof raw==='string'&&raw[0]==='=')raw=shiftFormula(raw,r-o.r,0);s.cells[k]={raw:raw,st:x.st};});});
  markDirty();refreshAll();
}

function drawChart(kind){
  const q=selRect();if(q.r1<=q.r0&&q.c1<=q.c0){toast('Selecciona un rango con datos (etiquetas y valores)');return;}
  const textCol=typeof valueOf(q.r0+1,q.c0)==='string'||(q.c1>q.c0&&typeof valueOf(q.r0+1,q.c0)!=='number'&&typeof valueOf(q.r0,q.c0)==='string')||(q.c1>q.c0&&typeof valueOf(q.r0+1,q.c0)==='string');
  const labelsCol=q.c1>q.c0&&textCol?q.c0:-1;
  const hdr=typeof valueOf(q.r0,q.c0+(labelsCol>=0?1:0))==='string';
  const r0=q.r0+(hdr?1:0);const cols=[];for(let c=q.c0+(labelsCol>=0?1:0);c<=q.c1;c++)cols.push(c);
  const labels=[];for(let r=r0;r<=q.r1;r++)labels.push(labelsCol>=0?displayOf(r,labelsCol):String(r-r0+1));
  const series=cols.map(c=>({name:hdr?displayOf(q.r0,c):colName(c),vals:labels.map((_,i)=>{const v=valueOf(r0+i,c);return typeof v==='number'?v:null;})}));
  const all=series.flatMap(s=>s.vals).filter(v=>v!==null);if(!all.length){toast('El rango no tiene números');return;}
  $('#chartBox').hidden=false;$('#chTitle').textContent=(kind==='bar'?'Gráfico de barras':'Gráfico de líneas')+' · '+selLabel();
  const cv=$('#chart'),g=cv.getContext('2d'),W=cv.width,Hh=cv.height;g.clearRect(0,0,W,Hh);g.fillStyle='#ffffff';g.fillRect(0,0,W,Hh);
  const L=64,R=20,T=24,B=64+(series.length>1?22:0);let mn=Math.min(0,...all),mx=Math.max(...all);if(mx===mn)mx=mn+1;
  const step=niceStep((mx-mn)/5);mn=Math.floor(mn/step)*step;mx=Math.ceil(mx/step)*step;
  const X=i=>L+(W-L-R)*(labels.length===1?0.5:(kind==='bar'?(i+0.5)/labels.length:i/(labels.length-1)));
  const Y=v=>T+(Hh-T-B)*(1-(v-mn)/(mx-mn));
  g.font='13px system-ui,sans-serif';g.textAlign='right';g.textBaseline='middle';
  for(let v=mn;v<=mx+1e-9;v+=step){const y=Y(v);g.strokeStyle='#e1e4e8';g.lineWidth=1;g.beginPath();g.moveTo(L,y);g.lineTo(W-R,y);g.stroke();g.fillStyle='#444';g.fillText(fmtG(parseFloat(v.toPrecision(8))),L-8,y);}
  g.strokeStyle='#888';g.beginPath();g.moveTo(L,T);g.lineTo(L,Hh-B);g.lineTo(W-R,Hh-B);g.stroke();
  const PAL=['#f5b301','#3a7ca5','#c0392b','#2e8b57','#8e5ea2','#6b7280'];
  g.textAlign='center';g.textBaseline='top';g.fillStyle='#333';const every=Math.ceil(labels.length/16);
  labels.forEach((l,i)=>{if(i%every===0)g.fillText(l.length>10?l.slice(0,9)+'…':l,X(i),Hh-B+8);});
  series.forEach((s,si)=>{g.fillStyle=g.strokeStyle=PAL[si%PAL.length];
    if(kind==='bar'){const bw=(W-L-R)/labels.length;const w=Math.min(46,bw*0.8/series.length);s.vals.forEach((v,i)=>{if(v===null)return;const x=X(i)-w*series.length/2+si*w;const y0=Y(Math.max(mn,0)),y1=Y(v);g.fillRect(x,Math.min(y0,y1),w-2,Math.abs(y1-y0));});}
    else{g.lineWidth=2.5;g.beginPath();let started=false;s.vals.forEach((v,i)=>{if(v===null)return;const x=X(i),y=Y(v);if(!started){g.moveTo(x,y);started=true;}else g.lineTo(x,y);});g.stroke();
      s.vals.forEach((v,i)=>{if(v===null)return;g.beginPath();g.arc(X(i),Y(v),4,0,7);g.fill();});}
  });
  if(series.length>1){g.textAlign='left';g.textBaseline='middle';let x=L;series.forEach((s,si)=>{g.fillStyle=PAL[si%PAL.length];g.fillRect(x,Hh-16,12,12);g.fillStyle='#333';g.fillText(s.name,x+16,Hh-10);x+=g.measureText(s.name).width+40;});}
}
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1)));const f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p;}

const hexArgb=h=>'FF'+h.replace('#','').toUpperCase();
function argbHex(a){if(!a)return null;a=String(a);if(a.length===8)a=a.slice(2);return /^[0-9A-Fa-f]{6}$/.test(a)?'#'+a.toLowerCase():null;}

async function buildXlsx(){
  const E=window.ExcelJS;const w=new E.Workbook();w.creator='Worksheet';
  const saveCur=wb.cur;
  wb.sheets.forEach((s,idx)=>{
    wb.cur=idx;recalc();
    const ws=w.addWorksheet(s.name.replace(/[\[\]:*?\/\\]/g,'').slice(0,31)||('Hoja'+(idx+1)),{views:s.frz?[{state:'frozen',ySplit:s.frz}]:[]});
    Object.keys(s.colW).forEach(c=>{ws.getColumn(+c+1).width=Math.max(1,(s.colW[c]-5)/7);});
    Object.keys(s.rowH).forEach(r=>{ws.getRow(+r+1).height=s.rowH[r]*0.75;});
    Object.keys(s.cells).forEach(k=>{
      const p=k.split(',');const r=+p[0],c=+p[1];const x=s.cells[k];const cell=ws.getCell(r+1,c+1);
      if(x.raw!==''&&x.raw!=null){
        if(typeof x.raw==='string'&&x.raw[0]==='='){const v=valueOf(r,c);cell.value={formula:excelFormula(x.raw),result:v===null?'':isErr(v)?{error:v.e}:v};}
        else{const v=parseInput(x.raw);cell.value=v;}
      }
      const st=x.st||{};
      if(st.b||st.i||st.u||st.fg)cell.font={bold:!!st.b,italic:!!st.i,underline:!!st.u,color:st.fg?{argb:hexArgb(st.fg)}:undefined};
      if(st.bg)cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:hexArgb(st.bg)}};
      if(st.al||st.wr)cell.alignment={horizontal:st.al?{l:'left',c:'center',r:'right'}[st.al]:undefined,wrapText:!!st.wr,vertical:st.wr?'top':undefined};
      if(st.nf&&NF_X[st.nf])cell.numFmt=NF_X[st.nf];
      if(st.bd){const o={};const L={t:'top',r:'right',b:'bottom',l:'left'};for(const ch of st.bd)o[L[ch]]={style:'thin',color:{argb:'FF000000'}};cell.border=o;}
    });
    s.merges.forEach(m=>{try{ws.mergeCells(m.r0+1,m.c0+1,m.r1+1,m.c1+1);}catch(e){}});
    s.cf.forEach(rule=>{
      const sty={font:{color:{argb:hexArgb(rule.fg)}},fill:{type:'pattern',pattern:'solid',bgColor:{argb:hexArgb(rule.bg)}}};
      const g=parseRange(rule.ref);if(!g)return;const first=addr(g.r0,g.c0);
      let r2;
      if(rule.op==='txt')r2={type:'containsText',operator:'containsText',text:rule.val,formulae:['NOT(ISERROR(SEARCH("'+rule.val.replace(/"/g,'""')+'",'+first+')))'],style:sty,priority:1};
      else if(rule.op==='f')r2={type:'expression',formulae:[excelFormula('='+rule.val)],style:sty,priority:1};
      else{const num=parseFloat(String(rule.val).replace(',','.'));const OP={lt:'lessThan',gt:'greaterThan',le:'lessThanOrEqual',ge:'greaterThanOrEqual',eq:'equal',ne:'notEqual'}[rule.op];
        r2={type:'cellIs',operator:OP,formulae:[isNaN(num)?'"'+rule.val+'"':num],style:sty,priority:1};}
      try{ws.addConditionalFormatting({ref:rule.ref,rules:[r2]});}catch(e){}
    });
  });
  wb.cur=saveCur;recalc();
  const buf=await w.xlsx.writeBuffer();
  return new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
async function importXlsx(buf){
  const E=window.ExcelJS;const w=new E.Workbook();await w.xlsx.load(buf);
  const sheets=[];
  w.eachSheet(ws=>{
    const s=newSheet(ws.name);
    ws.eachRow({includeEmpty:false},(row,rn)=>{
      if(row.height)s.rowH[rn-1]=Math.round(row.height/0.75);
      row.eachCell({includeEmpty:true},(cell,cn)=>{
        if(cn>120||rn>2000)return;
        let raw='',st={};const v=cell.value;
        const F=cell.formula;
        if(F){raw='='+F;}
        else if(v!==null&&v!==undefined){
          if(v instanceof Date){const d=v;raw=String(d.getUTCDate()).padStart(2,'0')+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+d.getUTCFullYear();}
          else if(typeof v==='object'){if(v.richText)raw=v.richText.map(x=>x.text).join('');else if(v.text!==undefined)raw=String(v.text);else if(v.result!==undefined)raw=String(v.result);else if(v.error)raw=v.error;}
          else raw=typeof v==='number'?String(v):typeof v==='boolean'?(v?'VERDADERO':'FALSO'):String(v);
        }
        const f=cell.font||{};if(f.bold)st.b=1;if(f.italic)st.i=1;if(f.underline)st.u=1;const fg=f.color&&argbHex(f.color.argb);if(fg&&fg!=='#000000')st.fg=fg;
        const fl=cell.fill;if(fl&&fl.type==='pattern'&&fl.pattern==='solid'){const bg=argbHex(fl.fgColor&&fl.fgColor.argb);if(bg&&bg!=='#ffffff')st.bg=bg;}
        const al=cell.alignment||{};if(al.horizontal==='left')st.al='l';else if(al.horizontal==='center')st.al='c';else if(al.horizontal==='right')st.al='r';if(al.wrapText)st.wr=1;
        const nf=nfFrom(cell.numFmt);if(nf!=='g')st.nf=nf;
        const b=cell.border;if(b){let bd='';if(b.top&&b.top.style)bd+='t';if(b.right&&b.right.style)bd+='r';if(b.bottom&&b.bottom.style)bd+='b';if(b.left&&b.left.style)bd+='l';if(bd)st.bd=bd;}
        if(raw!==''||Object.keys(st).length)s.cells[(rn-1)+','+(cn-1)]={raw:raw,st:st};
      });
    });
    (ws.columns||[]).forEach((col,i)=>{if(col&&col.width)s.colW[i]=Math.round(col.width*7+5);});
    const mg=(ws.model&&ws.model.merges)||[];mg.forEach(m=>{const g=parseRange(m);if(g)s.merges.push(g);});
    const v0=ws.views&&ws.views[0];if(v0&&v0.state==='frozen'&&v0.ySplit)s.frz=Math.min(3,v0.ySplit);
    (ws.conditionalFormattings||[]).forEach(cf=>{(cf.rules||[]).forEach(rl=>{
      const st=rl.style||{};const fg=argbHex(st.font&&st.font.color&&st.font.color.argb)||'#9c0006';
      const bg=argbHex((st.fill&&(st.fill.bgColor&&st.fill.bgColor.argb))||(st.fill&&st.fill.fgColor&&st.fill.fgColor.argb))||'#ffc7ce';
      if(rl.type==='cellIs'){const op={lessThan:'lt',greaterThan:'gt',lessThanOrEqual:'le',greaterThanOrEqual:'ge',equal:'eq',notEqual:'ne'}[rl.operator];if(op&&rl.formulae&&rl.formulae.length)s.cf.push({ref:cf.ref,op:op,val:String(rl.formulae[0]).replace(/^"|"$/g,''),bg:bg,fg:fg});}
      else if(rl.type==='containsText'&&rl.text)s.cf.push({ref:cf.ref,op:'txt',val:rl.text,bg:bg,fg:fg});
      else if(rl.type==='expression'&&rl.formulae&&rl.formulae.length)s.cf.push({ref:cf.ref,op:'f',val:String(rl.formulae[0]).replace(/^=/,''),bg:bg,fg:fg});
    });});
    sheets.push(s);
  });
  if(!sheets.length)sheets.push(newSheet('Hoja1'));
  return sheets;
}

function parseCSV(t){
  const first=t.split(/\r?\n/)[0]||'';const d=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length&&first.includes(';')?';':(first.includes('\t')?'\t':',');
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;else if(ch===d){row.push(cur);cur='';}else if(ch==='\n'){row.push(cur.replace(/\r$/,''));rows.push(row);row=[];cur='';}else cur+=ch;}
  if(cur!==''||row.length){row.push(cur.replace(/\r$/,''));rows.push(row);}
  return rows;
}
